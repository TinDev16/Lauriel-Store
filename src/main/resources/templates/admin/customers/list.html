<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Khách hàng (chỉ xem)','customers')}">
<body>
<section>
<form class="card card-body mb-3" method="get" th:action="@{/admin/customers}" data-live-filter>
<div class="row g-3 align-items-end"><div class="col-lg-6"><label class="form-label">Tìm khách hàng</label>
<input class="form-control" type="search" name="keyword" placeholder="Họ tên, tài khoản, email, điện thoại..." th:value="${keyword}"></div>
<div class="col-lg-3"><label class="form-label">Trạng thái tài khoản</label><select class="form-select" name="status"><option value="">Tất cả trạng thái</option>
<option th:each="item:${userStatuses}" th:value="${item}" th:text="${@view.label(item)}" th:selected="${item == status}"></option></select></div>
<div class="col-lg-3 d-flex gap-2">
<button class="btn btn-primary"><i class="bi bi-funnel"></i> Lọc</button>
<a class="btn btn-outline-secondary" th:href="@{/admin/customers}" title="Xóa bộ lọc"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
<a class="btn btn-outline-success text-nowrap" th:href="@{/admin/customers/export.xlsx(keyword=${keyword},status=${status})}" title="Xuất Excel"><i class="bi bi-file-earmark-excel me-1"></i>Xuất Excel</a>
</div></div></form>
<div class="card">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Mã</th>
<th>Tên đăng nhập</th>
<th>Họ tên</th>
<th>Thư điện tử</th>
<th>Số điện thoại</th>
<th>Trạng thái tài khoản</th>
<th>Ngày tạo</th>
<th class="text-center">Đơn hàng</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${page.content}">
<td th:text="|#${r.customerId}|">
</td>
<td th:text="${r.username == null ? '—' : r.username}">
</td>
<td>
<a class="fw-semibold text-dark text-decoration-none" th:href="@{/admin/orders(customerId=${r.customerId})}" th:text="${r.fullName}" title="Xem các đơn hàng của khách hàng này"></a>
</td>
<td th:text="${r.email == null ? '—' : r.email}">
</td>
<td th:text="${r.phone}">
</td>
<td th:text="${r.status == null ? 'Chưa liên kết tài khoản' : @view.label(r.status)}">
</td>
<td th:text="${@view.date(r.createdAt)}">
</td>
<td class="text-center">
<a class="btn btn-sm btn-outline-primary py-1 px-2 text-nowrap" th:href="@{/admin/orders(customerId=${r.customerId})}" title="Xem danh sách đơn hàng của khách hàng này">
<i class="bi bi-receipt me-1"></i>Xem đơn hàng
</a>
</td>
</tr>
<tr th:if="${#lists.isEmpty(page.content)}">
<td colspan="8" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td>
</tr>
</tbody>
</table>
</div>
</div>
<div th:replace="~{fragments/pagination :: pagination}">
</div>
</section>
</body>
</html>
