<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{store/fragments/layout :: layout(~{::main},${product.productName})}"><body><main class="container-xl store-page" th:attr="data-detail-product-id=${product.productId}">
<div class="store-detail-nav">
  <button type="button" class="store-back-button" data-store-back title="Quay lại trang trước" aria-label="Quay lại trang trước">
    <i class="bi bi-arrow-left"></i>
    <span>Quay lại</span>
  </button>
  <nav class="store-breadcrumb"><a th:href="@{/shop}">Trang chủ</a><i class="bi bi-chevron-right"></i><a th:href="@{/shop/products}">Sản phẩm</a><i class="bi bi-chevron-right"></i><a th:href="@{/shop/products(categoryId=${product.category.categoryId})}" th:text="${product.category.categoryName}"></a><i class="bi bi-chevron-right"></i><span th:text="${product.productName}"></span></nav>
</div>
<div class="store-detail"><section class="store-gallery"><div class="store-main-image"><img data-main-image th:src="${!#lists.isEmpty(product.images)} ? ${product.images[0].url} : (${product.imgUrl != null} ? ${product.imgUrl} : @{/assets/images/product-placeholder.svg})" th:alt="${product.productName}"></div><div class="store-thumbnails"><button th:each="image:${product.images}" type="button" th:attr="data-gallery-image=${image.url}"><img th:src="${image.url}" th:alt="${product.productName}"></button></div></section>
<section class="store-purchase-panel"><small th:text="${product.category.categoryName}"></small><h1 th:text="${product.productName}"></h1><div class="store-detail-price"><strong data-effective-price th:text="${@view.money(product.basePrice)}"></strong><del data-original-price hidden></del></div><p class="store-promo-note" data-promotion hidden></p><p class="store-description" th:text="${product.description}"></p>
<div class="store-option"><div><label>Kích cỡ</label><span data-size-help>Chọn kích cỡ</span></div><div class="store-option-buttons" data-size-options><button th:each="s:${sizes}" type="button" th:attr="data-size=${s.sizeId}" th:text="${s.sizeName}"></button></div></div>
<div class="store-option"><div><label>Màu sắc</label><span data-color-help>Chọn màu sắc</span></div><div class="store-option-buttons" data-color-options><button th:each="c:${colors}" type="button" th:attr="data-color=${c.colorId}" th:text="${c.colorName}"></button></div></div>
<div class="store-variant-meta"><span>Tồn kho: <strong data-stock>—</strong></span></div>
<div class="store-quantity"><label>Số lượng</label><div><button type="button" data-qty-minus>−</button><input data-quantity type="number" min="1" value="1"><button type="button" data-qty-plus>+</button></div></div>
<div class="store-purchase-actions"><form method="post" th:action="@{/shop/cart/add}" data-purchase-form><input type="hidden" name="productId" th:value="${product.productId}"><input type="hidden" name="variantId" data-variant-input><input type="hidden" name="quantity" data-quantity-input value="1"><button class="store-btn store-btn-outline" disabled data-purchase-button><i class="bi bi-bag-plus"></i> Thêm vào giỏ</button></form><form method="post" th:action="@{/shop/cart/buy-now}" data-purchase-form><input type="hidden" name="productId" th:value="${product.productId}"><input type="hidden" name="variantId" data-variant-input><input type="hidden" name="quantity" data-quantity-input value="1"><button class="store-btn store-btn-dark" disabled data-purchase-button>Mua ngay</button></form></div>
<div hidden data-variants><span th:each="v:${product.variants}" class="store-variant-data" th:attr="data-id=${v.variantId},data-size=${v.size.sizeId},data-color=${v.color.colorId},data-stock=${v.quantity},data-price=${v.price},data-effective=${v.effectivePrice},data-promotion=${v.promotion != null ? v.promotion.promotionName : ''}"></span></div>
</section></div>
<section class="store-section store-related" th:if="${!#lists.isEmpty(related)}"><div class="store-section-heading"><div><span>GỢI Ý CHO BẠN</span><h2>Sản phẩm tương tự</h2></div></div><div class="store-product-grid"><th:block th:each="p:${related}"><div th:replace="~{store/fragments/product-card :: card(${p})}"></div></th:block></div></section>
<script th:src="@{/assets/js/product-detail.js}" defer></script>
</main></body></html>
