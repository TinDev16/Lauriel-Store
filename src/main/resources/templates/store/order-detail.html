<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{store/fragments/layout :: layout(~{::main},|Đơn hàng #${order.orderId}|)}"><body><main class="container-xl store-page">
<nav class="store-breadcrumb"><a th:href="@{/shop/orders}">Đơn hàng</a><i class="bi bi-chevron-right"></i><span th:text="|#${order.orderId}|"></span></nav><header class="store-order-detail-head"><div><span>CHI TIẾT ĐƠN HÀNG</span><h1 th:text="|Đơn hàng #${order.orderId}|"></h1><p th:text="${@view.date(order.createdAt)}"></p></div><span class="store-order-status" th:classappend="| status-${#strings.toLowerCase(order.status.name())}|" th:text="${@view.label(order.status)}"></span></header>
<div class="store-order-detail-layout"><div><section class="store-checkout-card"><h2>Sản phẩm</h2><article class="store-checkout-item" th:each="item:${order.items}"><a th:href="@{/shop/products/{id}(id=${productIds[item.variantId]})}"><img th:src="${item.imageUrl != null} ? ${item.imageUrl} : @{/assets/images/product-placeholder.svg}" th:alt="${item.productName}"></a><div><a th:href="@{/shop/products/{id}(id=${productIds[item.variantId]})}" th:text="${item.productName}"></a><small th:text="|${item.size.sizeName} · ${item.color.colorName} · ${item.sku}|"></small><span th:text="|${@view.money(item.unitPrice)} × ${item.quantity}|"></span></div><strong th:text="${@view.money(item.subtotal)}"></strong></article></section><section class="store-checkout-card"><h2>Giao hàng</h2><div class="store-address"><i class="bi bi-geo-alt"></i><p th:text="${order.shippingAddress}"></p></div></section></div>
<aside><div class="store-summary-card"><h2>Thanh toán</h2><div><span>Tạm tính</span><strong th:text="${@view.money(order.totalAmount)}"></strong></div><div th:if="${order.orderPromotionDiscount.signum() > 0}"><span th:text="${order.orderPromotionName}"></span><strong class="store-discount" th:text="|-${@view.money(order.orderPromotionDiscount)}|"></strong></div><div th:if="${order.discountAmount.signum() > 0}"><span th:text="|Voucher ${order.voucherCode}|"></span><strong class="store-discount" th:text="|-${@view.money(order.discountAmount)}|"></strong></div><div><span>Phí giao hàng</span><strong th:text="${@view.money(order.shippingFee)}"></strong></div><div class="store-summary-total"><span>Tổng thanh toán</span><strong th:text="${@view.money(order.finalAmount)}"></strong></div></div><form th:if="${cancellable}" method="post" th:action="@{/shop/orders/{id}/cancel(id=${order.orderId})}" data-confirm="Bạn chắc chắn muốn hủy đơn hàng này?"><button class="store-btn store-btn-danger w-100">Hủy đơn hàng</button></form><a class="store-continue" th:href="@{/shop/orders}"><i class="bi bi-arrow-left"></i> Quay lại đơn hàng</a></aside></div>
</main></body></html>
