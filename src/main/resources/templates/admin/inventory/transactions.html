<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Lịch sử điều chỉnh','inventory/transactions')}">
<body>
<section>
<form class="card card-body mb-3" method="get" th:action="@{/admin/inventory/transactions}"
      data-live-filter data-inventory-variant-filter>
<div class="row g-3 align-items-end">
<div class="col-lg-4"><label class="form-label" for="transaction-keyword">Tìm giao dịch</label>
<input id="transaction-keyword" class="form-control" type="search" name="keyword"
       placeholder="Tên sản phẩm, SKU, tham chiếu..." th:value="${keyword}"></div>
<div class="col-lg-2"><label class="form-label" for="transaction-type">Loại giao dịch</label>
<select id="transaction-type" name="type" class="form-select"><option value="">Tất cả</option>
<option th:each="item:${transactionTypes}" th:value="${item}" th:text="${@view.label(item)}"
        th:selected="${item == type}"></option></select></div>
<div class="col-lg-6"><label class="form-label" for="transaction-product">Sản phẩm</label>
<select id="transaction-product" class="form-select" data-product-select data-cascade-filter>
<option value="">Tất cả sản phẩm</option>
<option th:each="item:${inventoryProducts}" th:value="${item.key}" th:text="${item.value}"></option>
</select></div>

<div class="col-12 mt-4"><div class="border-top pt-3"><h3 class="h6 mb-1">Chọn thuộc tính tương ứng</h3><p class="text-muted small mb-0">Kích cỡ và màu sắc chỉ hiển thị những tổ hợp đang có trong dữ liệu sản phẩm.</p></div></div>
<div class="col-lg-4"><label class="form-label" for="transaction-size">Kích cỡ</label>
<select id="transaction-size" class="form-select" data-size-select data-cascade-filter disabled>
<option value="">Chọn sản phẩm trước</option></select></div>
<div class="col-lg-4"><label class="form-label" for="transaction-color">Màu sắc</label>
<select id="transaction-color" class="form-select" data-color-select data-cascade-filter disabled>
<option value="">Chọn kích cỡ trước</option></select></div>
<div class="col-lg-4">
<input type="hidden" name="variantId" th:value="${variantId}" data-variant-id>
<div class="border rounded px-3 py-2 bg-body-tertiary h-100">
<span class="text-muted small d-block">Thuộc tính tương ứng</span>
<strong class="small" data-variant-result>Chưa chọn thuộc tính</strong>
</div></div>

<div class="d-none" aria-hidden="true">
<span th:each="variant:${variants}" data-variant-source
      th:attr="data-variant-id=${variant.variantId},data-product-id=${variant.productId},
               data-size-id=${variant.size.sizeId},data-size-name=${variant.size.sizeName},
               data-color-id=${variant.color.colorId},data-color-name=${variant.color.colorName},
               data-sku=${variant.sku}"></span>
</div>

<div class="col-md-4"><label class="form-label" for="transaction-from">Từ thời gian</label>
<input id="transaction-from" class="form-control" type="datetime-local" name="from" th:value="${from}"></div>
<div class="col-md-4"><label class="form-label" for="transaction-to">Đến thời gian</label>
<input id="transaction-to" class="form-control" type="datetime-local" name="to" th:value="${to}"></div>
<div class="col-md-4 d-flex flex-wrap gap-2">
<button class="btn btn-primary flex-grow-1"><i class="bi bi-funnel"></i> Lọc lịch sử</button>
<a class="btn btn-outline-secondary" th:href="@{/admin/inventory/transactions}" title="Xóa bộ lọc"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
<a class="btn btn-outline-success" th:href="@{/admin/inventory/export.xlsx(keyword=${keyword},variantId=${variantId},type=${type},from=${from},to=${to})}" title="Xuất Excel"><i class="bi bi-file-earmark-excel me-1"></i> Xuất Excel</a>
</div>
</div>
</form>
<div class="card">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Thời gian</th>
<th>Sản phẩm / Mã SKU</th>
<th>Loại</th>
<th>Số lượng</th>
<th>Tham chiếu</th>
<th>Người thực hiện</th>
<th>Ghi chú</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${page.content}">
<td th:text="${@view.date(r.createdAt)}">
</td>
<td>
<span th:text="${r.productName}">
</span>
<br>
<small th:text="${r.sku}">
</small>
</td>
<td th:text="${@view.label(r.type)}">
</td>
<td th:text="${r.quantity}">
</td>
<td th:text="|${@view.label(r.referenceType)} #${r.referenceId}|">
</td>
<td th:text="${r.performedBy == null ? '—' : r.performedBy.username}">
</td>
<td th:text="${r.note}">
</td>
</tr>
<tr th:if="${#lists.isEmpty(page.content)}">
<td colspan="7" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td>
</tr>
</tbody>
</table>
</div>
</div>
<div th:replace="~{fragments/pagination :: pagination}">
</div>
<script th:src="@{/assets/js/inventory-variant-filter.js(v=1)}"></script>
</section>
</body>
</html>
