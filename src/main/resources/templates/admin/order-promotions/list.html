<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Khuyến mãi đơn hàng','order-promotions')}"><body><section>
<div class="mb-3"><a class="btn btn-primary" th:href="@{/admin/order-promotions/new}">Thêm khuyến mãi đơn hàng</a></div>
<form class="card card-body mb-3" method="get" th:action="@{/admin/order-promotions}" data-live-filter><div class="row g-3 align-items-end"><div class="col-lg-7"><label class="form-label">Tìm kiếm</label><input class="form-control" type="search" name="keyword" placeholder="Tên hoặc mô tả..." th:value="${keyword}"></div><div class="col-lg-3"><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="">Tất cả</option><option th:each="item:${statuses}" th:value="${item}" th:text="${@view.label(item)}" th:selected="${item==status}"></option></select></div><div class="col-lg-2"><a class="btn btn-outline-secondary w-100" th:href="@{/admin/order-promotions}">Đặt lại</a></div></div></form>
<div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Tên</th><th>Đơn tối thiểu</th><th>Mức giảm</th><th>Giảm tối đa</th><th>Thời gian</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="r:${page.content}"><td><strong th:text="${r.promotionName}"></strong><div class="small text-muted" th:text="${r.description}"></div></td><td th:text="${@view.money(r.minOrderAmount)}"></td><td th:text="|${@view.number(r.discountPercent)}%|"></td><td th:text="${r.maxDiscountAmount==null?'Không giới hạn':@view.money(r.maxDiscountAmount)}"></td><td><span th:text="${@view.date(r.startDate)}"></span><br><small th:text="|đến ${@view.date(r.endDate)}|"></small></td><td th:text="${@view.label(r.status)}"></td><td class="text-nowrap"><a class="btn btn-outline-primary btn-sm" th:href="@{/admin/order-promotions/{id}/edit(id=${r.orderPromotionId})}">Sửa</a> <form class="d-inline" method="post" th:action="@{/admin/order-promotions/{id}/status(id=${r.orderPromotionId})}"><input type="hidden" name="status" th:value="${r.status.name()=='ACTIVE'?'INACTIVE':'ACTIVE'}"><button class="btn btn-outline-secondary btn-sm" th:text="${r.status.name()=='ACTIVE'?'Ngừng':'Kích hoạt'}"></button></form></td></tr>
<tr th:if="${#lists.isEmpty(page.content)}"><td colspan="7" class="text-center text-muted p-4">Chưa có khuyến mãi đơn hàng.</td></tr></tbody></table></div></div><div th:replace="~{fragments/pagination :: pagination}"></div></section></body></html>
