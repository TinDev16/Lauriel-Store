spring.application.name=lauriel-store
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lauriel}
spring.datasource.username=${DB_USERNAME:lauriel_user}
spring.datasource.password=${DB_PASSWORD:Lauriel@123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.thymeleaf.check-template-location=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Phase 2: JWT_SECRET must be Base64 of at least 32 random bytes.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.roles.initialize=${ROLE_INITIALIZATION_ENABLED:true}

# Thư mục lưu ảnh sản phẩm, có thể ghi đè bằng APP_IMAGES_DIRECTORY.
app.images.directory=uploads/products
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=42MB

# Server-owned commerce totals
store.shipping-fee=20000.00

# Telegram notification is optional and disabled by default.
telegram.enabled=true
telegram.bot-token=8809391037:AAGVCf84F4xQiv04I76N6esryjkjw_X8rp8
telegram.chat-id=1629880715
telegram.connect-timeout=${TELEGRAM_CONNECT_TIMEOUT:2s}
telegram.read-timeout=${TELEGRAM_READ_TIMEOUT:3s}

# Prevent HTTP debug logs from exposing Telegram URL credentials or order payloads.
logging.level.org.springframework.web.client=INFO
