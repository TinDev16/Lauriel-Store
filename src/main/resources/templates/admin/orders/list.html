<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Đơn hàng','orders')}">
<body>
<section>
<form class="row g-2 mb-3" method="get" th:action="@{/admin/orders}">
<div class="col-md-3">
<label class="form-label">Trạng thái</label>
<select name="status" class="form-select">
<option value="">Tất cả</option>
<option th:each="s:${orderStatuses}" th:value="${s}" th:text="${@view.label(s)}" th:selected="${s == status}">
</option>
</select>
</div>
<div class="col-md-3">
<label class="form-label">Từ</label>
<input class="form-control" type="datetime-local" name="from" th:value="${from}">
</div>
<div class="col-md-3">
<label class="form-label">Đến</label>
<input class="form-control" type="datetime-local" name="to" th:value="${to}">
</div>
<div class="col-auto">
<button class="btn btn-primary">Lọc</button>
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/orders}">Đặt lại</a>
</div>
</form>
<div class="card">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Mã</th>
<th>Khách hàng</th>
<th>Trạng thái</th>
<th>Tổng tiền</th>
<th>Giảm bằng mã</th>
<th>Số tiền phải trả</th>
<th>Thời gian</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${page.content}">
<td th:text="${r.orderId}">
</td>
<td>
<span th:text="${customerNames.get(r.customerId)}">
</span>
<small th:text="| (#${r.customerId})|">
</small>
</td>
<td th:text="${@view.label(r.status)}">
</td>
<td th:text="${@view.money(r.totalAmount)}">
</td>
<td th:text="${@view.money(r.discountAmount)}">
</td>
<td th:text="${@view.money(r.finalAmount)}">
</td>
<td th:text="${@view.date(r.createdAt)}">
</td>
<td>
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/orders/{id}(id=${r.orderId})}">Chi tiết</a>
</td>
</tr>
<tr th:if="${#lists.isEmpty(page.content)}">
<td colspan="8" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td>
</tr>
</tbody>
</table>
</div>
</div>
<div th:replace="~{fragments/pagination :: pagination}">
</div>
</section>
</body>
</html>
