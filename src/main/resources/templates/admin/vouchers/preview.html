<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="promotion-preview-content">
    <!-- Header info card -->
    <div class="card mb-3 border-0 bg-light shadow-sm">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle font-monospace fs-6 px-2 py-1 mb-1" th:text="${voucher.code}">CODE</span>
                    <h5 class="mb-0 text-dark fw-bold" th:text="${voucher.voucherName}">Tên voucher</h5>
                </div>
                <span class="badge fs-6 px-3 py-2"
                      th:classappend="${voucher.status.name() == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${@view.label(voucher.status)}">
                    Trạng thái
                </span>
            </div>
        </div>
    </div>

    <!-- Discount and Time Summary -->
    <div class="card mb-3 border shadow-sm">
        <div class="card-body p-3">
            <div class="row g-2 text-center">
                <div class="col-6 border-end">
                    <span class="text-muted small d-block mb-1">Mức giảm</span>
                    <span class="h4 mb-0 fw-bold text-danger" th:if="${voucher.discountType.name() == 'PERCENT'}" th:text="|-${@view.number(voucher.discountValue)}%|">-20%</span>
                    <span class="h4 mb-0 fw-bold text-danger" th:if="${voucher.discountType.name() == 'FIXED_AMOUNT'}" th:text="|-${@view.money(voucher.discountValue)}|">-50.000 ₫</span>
                </div>
                <div class="col-6">
                    <span class="text-muted small d-block mb-1">Số lượng còn lại</span>
                    <span class="h4 mb-0 fw-bold" th:classappend="${voucher.quantity <= 10} ? 'text-warning' : 'text-success'" th:text="${voucher.quantity}">100</span>
                </div>
            </div>
            <hr class="my-2">
            <div class="small">
                <div class="d-flex justify-content-between mb-1" th:if="${voucher.maxDiscountAmount != null}">
                    <span class="text-muted"><i class="bi bi-shield-check me-1"></i>Mức giảm tối đa:</span>
                    <span class="fw-semibold text-danger" th:text="${@view.money(voucher.maxDiscountAmount)}">100.000 ₫</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted"><i class="bi bi-cart-check me-1"></i>Đơn hàng tối thiểu:</span>
                    <span class="fw-semibold" th:text="${@view.money(voucher.minOrderAmount)}">200.000 ₫</span>
                </div>
                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted"><i class="bi bi-calendar-event me-1"></i>Bắt đầu:</span>
                    <span class="fw-semibold" th:text="${@view.date(voucher.startDate)}">01/01/2026 00:00</span>
                </div>
                <div class="d-flex justify-content-between">
                    <span class="text-muted"><i class="bi bi-calendar-check me-1"></i>Kết thúc:</span>
                    <span class="fw-semibold text-danger" th:text="${@view.date(voucher.endDate)}">31/12/2026 23:59</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Action buttons -->
    <div class="d-flex flex-column gap-2 mb-2 promotion-preview-actions">
        <a class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-1"
           th:href="@{/admin/vouchers/{id}/edit(id=${voucher.voucherId})}">
            <i class="bi bi-pencil"></i>
            <span>Chỉnh sửa mã giảm giá</span>
        </a>

        <form method="post" th:action="@{/admin/vouchers/{id}/status(id=${voucher.voucherId})}"
              data-confirm="Xác nhận thay đổi trạng thái mã giảm giá này?">
            <input type="hidden" name="status" th:value="${voucher.status.name() == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
            <button class="btn w-100 d-flex align-items-center justify-content-center gap-1"
                    th:classappend="${voucher.status.name() == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'">
                <i class="bi" th:classappend="${voucher.status.name() == 'ACTIVE'} ? 'bi-stop-circle' : 'bi-play-circle'"></i>
                <span th:text="${voucher.status.name() == 'ACTIVE' ? 'Ngừng kích hoạt' : 'Kích hoạt mã giảm giá'}"></span>
            </button>
        </form>

        <button type="button" class="btn btn-outline-secondary btn-promotion-quickview-close btn-quickview-close">
            <i class="bi bi-x-lg me-1"></i>Đóng
        </button>
    </div>
</div>
</body>
</html>
