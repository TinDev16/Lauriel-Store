<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký · LAURIEL</title><link rel="stylesheet" th:href="@{/assets/libs/bootstrap/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/assets/libs/bootstrap-icons/bootstrap-icons.css}"><link rel="stylesheet" th:href="@{/assets/css/store.css}"><link rel="stylesheet" th:href="@{/assets/css/toast.css}"></head><body class="store-auth"><div th:replace="~{fragments/alerts :: alerts}"></div><a class="store-auth-brand" th:href="@{/shop}">LAURIEL</a><main class="store-auth-card"><span>TẠO TÀI KHOẢN</span><h1>Tham gia cùng LAURIEL</h1><p>Lưu thông tin giao hàng và theo dõi đơn hàng dễ dàng hơn.</p><form method="post" th:action="@{/register}" th:object="${form}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><label>Họ và tên<input class="form-control" th:field="*{fullName}" required maxlength="150"></label><label>Tên đăng nhập<input class="form-control" th:field="*{username}" required maxlength="100" autocomplete="username"></label><label>Email<input class="form-control" type="email" th:field="*{email}" maxlength="150"></label><label>Số điện thoại<input class="form-control" th:field="*{phone}" maxlength="20"></label><label>Mật khẩu<input class="form-control" type="password" th:field="*{password}" required minlength="8" maxlength="72" autocomplete="new-password"></label><div class="store-field-errors" th:if="${#fields.hasAnyErrors()}" th:each="e:${#fields.allErrors()}" th:text="${e}"></div><button class="store-btn store-btn-dark w-100">Đăng ký</button></form><p class="store-auth-switch">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p></main><script th:src="@{/assets/js/toast.js}"></script></body></html>
