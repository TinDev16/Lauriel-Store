<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{store/fragments/layout :: layout(~{::main},'Chỉnh sửa hồ sơ')}"><body><main class="container-xl store-page store-form-page"><nav class="store-breadcrumb"><a th:href="@{/shop/profile}">Hồ sơ</a><i class="bi bi-chevron-right"></i><span>Chỉnh sửa</span></nav><section class="store-form-card"><header><span>THÔNG TIN CÁ NHÂN</span><h1>Chỉnh sửa hồ sơ</h1></header><form method="post" th:action="@{/shop/profile/edit}" th:object="${form}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="e:${#fields.globalErrors()}" th:text="${e}"></div><label>Họ và tên<input class="form-control" th:field="*{fullName}" maxlength="150" required><small class="text-danger" th:errors="*{fullName}"></small></label><label>Tên đăng nhập<input class="form-control" th:value="${profile.username}" disabled></label><label>Email<input class="form-control" type="email" th:field="*{email}" maxlength="150"><small class="text-danger" th:errors="*{email}"></small></label><label>Số điện thoại<input class="form-control" th:field="*{phone}" maxlength="20"><small class="text-danger" th:errors="*{phone}"></small></label><label>Địa chỉ<textarea class="form-control" th:field="*{address}" rows="4" maxlength="10000"></textarea><small class="text-danger" th:errors="*{address}"></small></label><div class="store-form-actions"><a class="store-btn store-btn-outline" th:href="@{/shop/profile}">Hủy</a><button class="store-btn store-btn-dark">Lưu thay đổi</button></div></form></section></main></body></html>
