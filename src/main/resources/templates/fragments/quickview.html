<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="quickview">
    <!-- Global Admin Quickview Drawer (Sub-form dùng chung toàn hệ thống) -->
    <div class="app-quickview-backdrop" id="appQuickviewBackdrop"></div>
    <aside class="app-quickview-panel shadow-lg" id="appQuickviewPanel" aria-hidden="true">
        <div class="app-quickview-header">
            <div class="d-flex align-items-center gap-2">
                <span class="app-quickview-icon" id="appQuickviewIcon"><i class="bi bi-layout-sidebar-inset-reverse"></i></span>
                <div>
                    <h2 class="h6 mb-0 fw-bold" id="appQuickviewTitle">Chi tiết</h2>
                    <small class="text-muted" id="appQuickviewSubtitle">Xem nhanh thông tin</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-1">
                <a href="#" id="appQuickviewFullLink" class="btn btn-sm btn-outline-secondary" target="_blank"
                    title="Mở trang chi tiết đầy đủ trong tab mới" style="display: none;">
                    <i class="bi bi-box-arrow-up-right"></i>
                </a>
                <button type="button" class="btn-close ms-2" id="appQuickviewClose" aria-label="Đóng"></button>
            </div>
        </div>
        <div class="app-quickview-body" id="appQuickviewBody">
            <div class="app-quickview-empty text-center p-5 text-muted">
                <i class="bi bi-inbox fs-1 mb-2 d-block"></i>
                <p>Vui lòng chọn một mục để xem chi tiết.</p>
            </div>
        </div>
    </aside>
</th:block>
