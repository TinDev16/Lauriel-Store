<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Mã giảm giá','vouchers')}">
<body>
<section>
<div class="mb-3">
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/vouchers/new}">Thêm mã giảm giá</a>
</div>
<form class="card card-body mb-3" method="get" th:action="@{/admin/vouchers}" data-live-filter>
<div class="row g-3 align-items-end"><div class="col-lg-5"><label class="form-label">Tìm mã giảm giá</label>
<input class="form-control" type="search" name="keyword" placeholder="Mã hoặc tên mã giảm giá..." th:value="${keyword}"></div>
<div class="col-lg-3"><label class="form-label">Loại giảm</label><select class="form-select" name="discountType"><option value="">Tất cả loại</option>
<option th:each="item:${discountTypes}" th:value="${item}" th:text="${@view.label(item)}" th:selected="${item == discountType}"></option></select></div>
<div class="col-lg-2"><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="">Tất cả</option>
<option th:each="item:${statuses}" th:value="${item}" th:text="${@view.label(item)}" th:selected="${item == status}"></option></select></div>
<div class="col-lg-2"><a class="btn btn-outline-secondary w-100" th:href="@{/admin/vouchers}">Đặt lại</a></div></div></form>
<div class="card">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Mã</th>
<th>Tên</th>
<th>Loại</th>
<th>Giá trị</th>
<th>Đơn tối thiểu</th>
<th>Giảm tối đa</th>
<th>Còn lại</th>
<th>Bắt đầu</th>
<th>Kết thúc</th>
<th>Trạng thái</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${page.content}">
<td th:text="${r.code}">
</td>
<td th:text="${r.voucherName}">
</td>
<td th:text="${@view.label(r.discountType)}">
</td>
<td th:text="${@view.number(r.discountValue)}">
</td>
<td th:text="${@view.money(r.minOrderAmount)}">
</td>
<td th:text="${@view.money(r.maxDiscountAmount)}">
</td>
<td th:text="${r.quantity}">
</td>
<td th:text="${@view.date(r.startDate)}">
</td>
<td th:text="${@view.date(r.endDate)}">
</td>
<td th:text="${@view.label(r.status)}">
</td>
<td class="text-nowrap">
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/vouchers/{id}/edit(id=${r.voucherId})}">Sửa</a>
<form class="d-inline" method="post" th:action="@{/admin/vouchers/{id}/status(id=${r.voucherId})}" data-confirm="Thay đổi trạng thái?">
<input type="hidden" name="status" th:value="${r.status.name() == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
<button class="btn btn-outline-secondary btn-sm" th:text="${r.status.name() == 'ACTIVE' ? 'Ngừng hoạt động' : 'Kích hoạt'}">
</button>
</form>
</td>
</tr>
<tr th:if="${#lists.isEmpty(page.content)}">
<td colspan="11" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td>
</tr>
</tbody>
</table>
</div>
</div>
<div th:replace="~{fragments/pagination :: pagination}">
</div>
</section>
</body>
</html>
