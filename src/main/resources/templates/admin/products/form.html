<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::section},'Thông tin sản phẩm','products')}">
<body><section>
<div class="card"><div class="card-body">
<form method="post" enctype="multipart/form-data" th:action="@{${action}}" th:object="${form}">
<div th:replace="~{fragments/fields :: errors}"></div>
<div th:replace="~{fragments/fields :: input('productName','Tên sản phẩm','text')}"></div>
<div class="mb-3">
<label class="form-label" for="categoryId">Danh mục</label>
<select id="categoryId" class="form-select" th:field="*{categoryId}" required>
<option value="">Chọn danh mục</option>
<option th:each="category:${categories}" th:value="${category.categoryId}" th:text="${category.categoryName}"></option>
</select>
<div class="text-danger small" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
</div>
<div th:replace="~{fragments/fields :: text('description','Mô tả')}"></div>
<div th:replace="~{fragments/fields :: input('price','Giá cơ bản','number')}"></div>
<div class="mb-3">
<label class="form-label d-block" for="imageFiles">Hình ảnh sản phẩm</label>
<input id="imageFiles" class="visually-hidden" type="file" name="imageFiles" multiple
       accept="image/png,image/jpeg,image/webp" aria-describedby="imageHelp"
       th:attr="data-existing-count=${#lists.size(productImages)}">
<label class="btn btn-outline-primary btn-sm" for="imageFiles">Chọn nhiều hình ảnh</label>
<span id="selectedImageName" class="ms-2 text-muted">Chưa chọn ảnh mới</span>
<div id="imageError" class="text-danger small mt-1" role="alert" hidden></div>
<div id="imageHelp" class="form-text">PNG, JPEG hoặc WebP; tối đa 5 MB/ảnh và 8 ảnh/sản phẩm. Thứ tự chọn là thứ tự hiển thị.</div>
<div id="newImagePreviews" class="row g-3 mt-1"></div>
<template id="imageColorOptions">
<option value="">Dùng chung cho mọi màu</option>
<option th:each="color:${colors}" th:value="${color.colorId}" th:text="${color.colorName}"></option>
</template>
</div>
<div th:replace="~{fragments/fields :: status}"></div>
<button class="btn btn-primary">Lưu sản phẩm</button>
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/products}">Quay lại</a>
</form>
</div></div>

<div class="card mt-4" th:if="${id != null}"><div class="card-body">
<h2 class="h5 mb-3">Thư viện hình ảnh</h2>
<p class="text-muted" th:if="${#lists.isEmpty(productImages)}">Sản phẩm chưa có hình ảnh.</p>
<div class="row g-3" th:unless="${#lists.isEmpty(productImages)}">
<div class="col-6 col-md-3" th:each="image:${productImages}">
<div class="border rounded p-2 h-100">
<img th:src="${image.url}" class="img-fluid rounded mb-2" style="height:160px;width:100%;object-fit:cover" alt="Hình sản phẩm">
<div class="d-flex flex-wrap gap-1 mb-2">
<span class="badge text-bg-primary" th:if="${image.primary}">Ảnh đại diện</span>
<span class="badge text-bg-light border" th:text="${image.colorName != null ? 'Màu ' + image.colorName : 'Mọi màu'}"></span>
</div>
<form th:if="${!image.primary}" method="post" class="d-inline"
      th:action="@{/admin/products/{id}/images/{imageId}/primary(id=${id},imageId=${image.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="btn btn-outline-primary btn-sm">Đặt đại diện</button>
</form>
<form method="post" class="d-inline"
      th:action="@{/admin/products/{id}/images/{imageId}/delete(id=${id},imageId=${image.id})}"
      onsubmit="return confirm('Xóa hình ảnh này?')">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="btn btn-outline-danger btn-sm">Xóa</button>
</form>
</div></div>
</div>
</div></div>
<script th:src="@{/js/product-image-preview.js}" defer></script>
</section></body>
</html>
