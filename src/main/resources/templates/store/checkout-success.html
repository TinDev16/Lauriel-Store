<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{store/fragments/layout :: layout(~{::main},'Đặt hàng thành công')}"><body><main class="container-xl store-page"><section class="store-success"><div class="store-success-icon"><i class="bi bi-check-lg"></i></div><span>ĐƠN HÀNG ĐÃ ĐƯỢC TIẾP NHẬN</span><h1>Đặt hàng thành công</h1><p>Cảm ơn bạn đã mua sắm tại LAURIEL. Chúng tôi sẽ sớm xác nhận đơn hàng.</p><div class="store-success-order"><div><small>Mã đơn hàng</small><strong th:text="|#${order.orderId}|"></strong></div><div><small>Tổng thanh toán</small><strong th:text="${@view.money(order.finalAmount)}"></strong></div></div><div class="store-success-actions"><a class="store-btn store-btn-dark" th:href="@{/shop/orders/{id}(id=${order.orderId})}">Xem đơn hàng</a><a class="store-btn store-btn-outline" th:href="@{/shop/products}">Tiếp tục mua sắm</a></div></section></main></body></html>
