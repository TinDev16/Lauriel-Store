<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Sản phẩm khuyến mãi','promotions')}">
<body>
<section>
<h2 class="h5" th:text="${promotion.promotionName}">
</h2>
<div class="card mb-3">
<div class="card-body">
<form class="d-flex gap-2" method="post" th:action="@{/admin/promotions/{id}/products(id=${promotion.promotionId})}">
<label class="visually-hidden" for="productId">Mã sản phẩm</label>
<input id="productId" class="form-control w-auto" name="productId" type="number" min="1" step="1" placeholder="Mã sản phẩm" required>
<button class="btn btn-primary">Thêm sản phẩm</button>
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/products}">Tra cứu sản phẩm</a>
</form>
</div>
</div>
<div class="card">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Mã</th>
<th>Sản phẩm</th>
<th>Giá</th>
<th>Trạng thái</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${page.content}">
<td th:text="${r.productId}">
</td>
<td th:text="${r.productName}">
</td>
<td th:text="${@view.money(r.price)}">
</td>
<td th:text="${@view.label(r.status)}">
</td>
<td>
<form method="post" th:action="@{/admin/promotions/{id}/products/{p}/remove(id=${promotion.promotionId},p=${r.productId})}" data-confirm="Bỏ liên kết Product khỏi Promotion?">
<button class="btn btn-outline-danger btn-sm">Gỡ sản phẩm</button>
</form>
</td>
</tr>
<tr th:if="${#lists.isEmpty(page.content)}">
<td colspan="5" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td>
</tr>
</tbody>
</table>
</div>
</div>
<div th:replace="~{fragments/pagination :: pagination}">
</div>
<div class="mt-3">
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/promotions}">Khuyến mãi</a>
</div>
</section>
</body>
</html>
