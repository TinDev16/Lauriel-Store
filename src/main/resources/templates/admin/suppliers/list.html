<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Nhà cung cấp','suppliers')}">
<body>
<section>
<div class="mb-3 d-flex justify-content-between align-items-center">
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/suppliers/new}"><i class="bi bi-plus-lg me-1"></i>Thêm nhà cung cấp</a>
<a class="btn btn-outline-success btn-sm" th:href="@{/admin/suppliers/export.xlsx(keyword=${keyword},status=${status})}" title="Xuất Excel"><i class="bi bi-file-earmark-excel me-1"></i>Xuất Excel</a>
</div>
<form class="card card-body mb-3" method="get" th:action="@{/admin/suppliers}" data-live-filter>
<div class="row g-3 align-items-end"><div class="col-lg-6"><label class="form-label">Tìm nhà cung cấp</label>
<input class="form-control" type="search" name="keyword" placeholder="Tên, điện thoại, email, địa chỉ..." th:value="${keyword}"></div>
<div class="col-lg-3"><label class="form-label">Trạng thái</label><select class="form-select" name="status">
<option value="">Tất cả trạng thái</option><option th:each="item:${statuses}" th:value="${item}" th:text="${@view.label(item)}" th:selected="${item == status}"></option>
</select></div>
<div class="col-lg-3 d-flex gap-2">
<button class="btn btn-primary"><i class="bi bi-funnel"></i> Lọc</button>
<a class="btn btn-outline-secondary" th:href="@{/admin/suppliers}" title="Xóa bộ lọc"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
<a class="btn btn-outline-success text-nowrap" th:href="@{/admin/suppliers/export.xlsx(keyword=${keyword},status=${status})}" title="Xuất Excel"><i class="bi bi-file-earmark-excel me-1"></i>Xuất Excel</a>
</div></div></form>
<div class="card">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Mã</th>
<th>Nhà cung cấp</th>
<th>Số điện thoại</th>
<th>Thư điện tử</th>
<th>Địa chỉ</th>
<th>Trạng thái</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${page.content}">
<td th:text="${r.supplierId}">
</td>
<td th:text="${r.supplierName}">
</td>
<td th:text="${r.phone}">
</td>
<td th:text="${r.email}">
</td>
<td th:text="${r.address}">
</td>
<td th:text="${@view.label(r.status)}">
</td>
<td class="text-nowrap">
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/suppliers/{id}/edit(id=${r.supplierId})}">Sửa</a>
<form class="d-inline" method="post" th:action="@{/admin/suppliers/{id}/status(id=${r.supplierId})}" data-confirm="Thay đổi trạng thái?">
<input type="hidden" name="status" th:value="${r.status.name() == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
<button class="btn btn-outline-secondary btn-sm" th:text="${r.status.name() == 'ACTIVE' ? 'Ngừng hoạt động' : 'Kích hoạt'}">
</button>
</form>
</td>
</tr>
<tr th:if="${#lists.isEmpty(page.content)}">
<td colspan="7" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td>
</tr>
</tbody>
</table>
</div>
</div>
<div th:replace="~{fragments/pagination :: pagination}">
</div>
</section>
</body>
</html>
