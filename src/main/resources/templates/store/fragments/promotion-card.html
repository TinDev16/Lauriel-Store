<th:block xmlns:th="http://www.thymeleaf.org">
  <a th:fragment="product(p)" th:href="@{/shop/products}" class="store-offer store-offer-dark">
    <small>GIẢM GIÁ SẢN PHẨM</small><strong th:text="|Giảm ${@view.number(p.discountPercent)}%|"></strong><span th:text="${p.promotionName}"></span>
  </a>
  <article th:fragment="order(p)" class="store-offer">
    <small>ƯU ĐÃI TỰ ĐỘNG</small><strong th:text="|Đơn từ ${@view.money(p.minOrderAmount)}|"></strong><span th:text="|Giảm ${@view.number(p.discountPercent)}% · tối đa ${@view.money(p.maxDiscountAmount)}|"></span>
  </article>
  <article th:fragment="voucher(v)" class="store-offer store-offer-accent">
    <small>VOUCHER</small><strong th:text="${v.code}"></strong><span th:text="|${v.voucherName} · đơn từ ${@view.money(v.minOrderAmount)}|"></span>
  </article>
</th:block>
