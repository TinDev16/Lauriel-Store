<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{fragments/layout :: layout(~{::section},'Đơn hàng','orders')}">

<body>
    <section>
        <form class="card card-body mb-3 order-filter-card" method="get" th:action="@{/admin/orders}" data-live-filter>
            <input type="hidden" name="customerId" th:value="${customerId}" th:if="${customerId != null}">
            <div class="order-filter-row">
                <div class="col-filter-search">
                    <label class="form-label small fw-semibold mb-1">Tìm đơn hàng</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-search"></i></span>
                        <input class="form-control border-start-0 ps-0" type="search" name="keyword" placeholder="Mã đơn, tên hoặc SĐT khách..."
                            th:value="${keyword}">
                    </div>
                </div>
                <div class="col-filter-status">
                    <label class="form-label small fw-semibold mb-1">Trạng thái</label>
                    <select name="status" class="form-select">
                        <option value="">Tất cả trạng thái</option>
                        <option th:each="s:${orderStatuses}" th:value="${s}" th:text="${@view.label(s)}"
                            th:selected="${s == status}">
                        </option>
                    </select>
                </div>
                <div class="col-filter-date">
                    <label class="form-label small fw-semibold mb-1">Từ ngày</label>
                    <input class="form-control" type="datetime-local" name="from" th:value="${from}">
                </div>
                <div class="col-filter-date">
                    <label class="form-label small fw-semibold mb-1">Đến ngày</label>
                    <input class="form-control" type="datetime-local" name="to" th:value="${to}">
                </div>
                <div class="col-filter-actions d-flex gap-2">
                    <button class="btn btn-primary text-nowrap"><i class="bi bi-funnel"></i> Lọc</button>
                    <a class="btn btn-outline-secondary text-nowrap" th:href="@{/admin/orders}" title="Xóa bộ lọc"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
                    <a class="btn btn-outline-success text-nowrap" th:href="@{/admin/orders/export.xlsx(keyword=${keyword},status=${status},from=${from},to=${to},customerId=${customerId})}" title="Xuất Excel"><i class="bi bi-file-earmark-excel me-1"></i>Xuất Excel</a>
                </div>
            </div>
        </form>
        <div class="alert alert-info d-flex align-items-center justify-content-between mb-3 shadow-sm border-info" th:if="${customerId != null}">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-person-bounding-box fs-5 text-primary"></i>
                <div>
                    <span>Đang lọc danh sách đơn hàng của khách hàng: </span>
                    <strong class="text-primary" th:text="${filterCustomer != null ? filterCustomer.fullName + ' (#' + customerId + ')' : '#' + customerId}"></strong>
                    <span th:if="${filterCustomer != null && filterCustomer.phone != null}" th:text="| · SĐT: ${filterCustomer.phone}|" class="text-muted small"></span>
                </div>
            </div>
            <a th:href="@{/admin/orders}" class="btn btn-sm btn-outline-secondary text-nowrap"><i class="bi bi-x-circle me-1"></i>Xem tất cả đơn hàng</a>
        </div>
        <div class="card">
            <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="ordersTable">
                        <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Khách hàng</th>
                                <th>Thời gian</th>
                                <th>Trạng thái</th>
                                <th class="text-end">Tiền hàng</th>
                                <th class="text-end">Khuyến mãi đơn</th>
                                <th class="text-end">Giảm bằng mã</th>
                                <th class="text-end">Số tiền đơn hàng</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r:${page.content}" th:id="|order-row-${r.orderId}|"
                                th:data-order-id="${r.orderId}"
                                th:data-quickview-url="@{/admin/orders/{id}/preview(id=${r.orderId})}"
                                th:data-quickview-title="|Đơn hàng #${r.orderId}|"
                                data-quickview-subtitle="Thông tin chi tiết hóa đơn"
                                data-quickview-icon="bi-receipt"
                                th:data-quickview-full-link="@{/admin/orders/{id}(id=${r.orderId})}"
                                class="order-row quickview-row">
                                <td class="fw-semibold" th:text="|#${r.orderId}|"></td>
                                <td>
                                    <a class="text-decoration-none fw-semibold text-dark hover-primary" th:href="@{/admin/orders(customerId=${r.customerId})}" th:text="${customerNames.get(r.customerId)}" title="Xem tất cả đơn của khách này"></a>
                                </td>
                                <td class="text-nowrap" th:text="${@view.date(r.createdAt)}"></td>
                                <td>
                                    <span class="order-status-badge badge"
                                        th:classappend="${r.status.name() == 'DELIVERED' ? 'bg-success' : (r.status.name() == 'CANCELLED' || r.status.name() == 'RETURNED' ? 'bg-danger' : (r.status.name() == 'PENDING' ? 'bg-warning text-dark' : (r.status.name() == 'CONFIRMED' ? 'bg-info text-dark' : 'bg-primary')))}"
                                        th:text="${@view.label(r.status)}">
                                    </span>
                                </td>
                                <td class="text-end text-nowrap" th:text="${@view.money(r.totalAmount)}"></td>
                                <td class="text-end text-nowrap">
                                    <span th:if="${r.orderPromotionDiscount != null and r.orderPromotionDiscount > 0}"
                                          class="text-danger" th:text="|-${@view.money(r.orderPromotionDiscount)}|"></span>
                                    <span th:unless="${r.orderPromotionDiscount != null and r.orderPromotionDiscount > 0}" class="text-muted">—</span>
                                </td>
                                <td class="text-end text-nowrap">
                                    <span th:if="${r.discountAmount != null and r.discountAmount > 0}"
                                          class="text-danger" th:text="|-${@view.money(r.discountAmount)}|"></span>
                                    <span th:unless="${r.discountAmount != null and r.discountAmount > 0}" class="text-muted">—</span>
                                </td>
                                <td class="text-end text-nowrap fw-bold text-primary fs-6" th:text="${@view.money(r.finalAmount)}"></td>
                                <td class="text-center text-nowrap">
                                    <button type="button" class="btn btn-outline-primary btn-sm btn-quickview"
                                        th:data-quickview-url="@{/admin/orders/{id}/preview(id=${r.orderId})}"
                                        th:data-quickview-title="|Đơn hàng #${r.orderId}|"
                                        data-quickview-subtitle="Thông tin chi tiết hóa đơn"
                                        data-quickview-icon="bi-receipt"
                                        th:data-quickview-full-link="@{/admin/orders/{id}(id=${r.orderId})}"
                                        title="Xem nhanh bên phải">
                                        <i class="bi bi-layout-sidebar-inset-reverse me-1"></i>Chi tiết
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(page.content)}">
                                <td colspan="9" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td>
                            </tr>
                        </tbody>
                        <tfoot th:if="${!#lists.isEmpty(page.content)}">
                            <tr class="table-light border-top">
                                <td colspan="7" class="text-end fw-bold py-3 text-secondary">
                                    Tổng số tiền đơn hàng (trang này):
                                </td>
                                <td class="text-end fw-bold fs-6 text-danger py-3 text-nowrap"
                                    th:text="${@view.money(pageTotalAmount)}">0 đ</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
            </div>
        </div>
        <div th:replace="~{fragments/pagination :: pagination}">
        </div>
    </section>
</body>

</html>
