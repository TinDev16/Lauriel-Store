<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{store/fragments/layout :: layout(~{::main},'Sản phẩm')}"><body><main class="container-xl store-page">
<nav class="store-breadcrumb"><a th:href="@{/shop}">Trang chủ</a><i class="bi bi-chevron-right"></i><span>Sản phẩm</span></nav>
<header class="store-page-heading"><div><span>BỘ SƯU TẬP</span><h1>Sản phẩm</h1><p th:text="|${page.totalElements} sản phẩm phù hợp|"></p></div><button class="store-filter-toggle" type="button" data-filter-toggle><i class="bi bi-sliders"></i> Bộ lọc</button></header>
<div class="store-catalog"><aside class="store-filters" data-filter-panel><form method="get" th:action="@{/shop/products}"><label>Tìm kiếm<input class="form-control" name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm"></label><label>Phân loại<select class="form-select" name="categoryId"><option value="">Tất cả</option><option th:each="c:${categories}" th:value="${c.categoryId}" th:text="${c.categoryName}" th:selected="${c.categoryId == categoryId}"></option></select></label><label>Kích cỡ<select class="form-select" name="sizeId"><option value="">Tất cả</option><option th:each="s:${sizes}" th:value="${s.sizeId}" th:text="${s.sizeName}" th:selected="${s.sizeId == sizeId}"></option></select></label><label>Màu sắc<select class="form-select" name="colorId"><option value="">Tất cả</option><option th:each="c:${colors}" th:value="${c.colorId}" th:text="${c.colorName}" th:selected="${c.colorId == colorId}"></option></select></label><label>Sắp xếp<select class="form-select" name="sort"><option value="createdAt" th:selected="${sort == 'createdAt'}">Mới nhất</option><option value="price" th:selected="${sort == 'price'}">Giá cao đến thấp</option><option value="productName" th:selected="${sort == 'productName'}">Tên A–Z</option></select></label><button class="store-btn store-btn-dark w-100">Áp dụng</button><a class="store-filter-clear" th:href="@{/shop/products}">Xóa bộ lọc</a></form></aside>
<section><div class="store-product-grid"><th:block th:each="p:${page.content}"><div th:replace="~{store/fragments/product-card :: card(${p})}"></div></th:block></div><div class="store-empty" th:if="${#lists.isEmpty(page.content)}"><i class="bi bi-search"></i><h2>Không tìm thấy sản phẩm phù hợp.</h2><a class="store-btn store-btn-dark" th:href="@{/shop/products}">Xem tất cả sản phẩm</a></div>
<nav class="store-pagination" th:if="${page.totalPages > 1}"><a th:classappend="${page.page == 0} ? disabled" th:href="@{/shop/products(page=${page.page - 1},keyword=${keyword},categoryId=${categoryId},sizeId=${sizeId},colorId=${colorId},sort=${sort})}"><i class="bi bi-arrow-left"></i></a><span th:text="|Trang ${page.page + 1} / ${page.totalPages}|"></span><a th:classappend="${page.page + 1 >= page.totalPages} ? disabled" th:href="@{/shop/products(page=${page.page + 1},keyword=${keyword},categoryId=${categoryId},sizeId=${sizeId},colorId=${colorId},sort=${sort})}"><i class="bi bi-arrow-right"></i></a></nav></section></div>
</main></body></html>
