<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Quản lý tài khoản','accounts')}">
<body><section class="account-page">
<div class="account-hero">
  <div><span class="account-eyebrow">BẢO MẬT HỆ THỐNG</span><h2>Quản lý tài khoản</h2><p>Kiểm soát tài khoản, vai trò và trạng thái truy cập trên toàn hệ thống.</p></div>
  <a class="btn btn-light" th:href="@{/admin/accounts/new}"><i class="bi bi-person-plus"></i> Tạo tài khoản quản lý</a>
</div>

<form class="account-filter" method="get" th:action="@{/admin/accounts}" data-live-filter data-preserve-scroll>
  <input type="hidden" name="page" value="0">
  <div><label class="form-label">Tìm kiếm</label><input class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Username, họ tên, email, điện thoại"></div>
  <div><label class="form-label">Vai trò</label><select class="form-select" name="role"><option value="">Tất cả vai trò</option><option th:each="item:${accountRoles}" th:value="${item}" th:text="${item}" th:selected="${item == role}"></option></select></div>
  <div><label class="form-label">Trạng thái</label><select class="form-select" name="status"><option value="">Tất cả trạng thái</option><option th:each="item:${userStatuses}" th:value="${item}" th:text="${item}" th:selected="${item == status}"></option></select></div>
  <a class="btn btn-outline-secondary" th:href="@{/admin/accounts}"><i class="bi bi-arrow-counterclockwise"></i> Đặt lại</a>
</form>

<div class="account-table-card">
<div class="table-responsive"><table class="table align-middle mb-0 account-table">
  <thead><tr><th>Tài khoản</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Email</th><th>Ngày tạo</th><th></th></tr></thead>
  <tbody>
  <tr th:each="item:${page.content}">
    <td><a th:href="@{/admin/accounts/{id}(id=${item.userId})}" th:text="|@${item.username}|"></a><small th:text="|ID #${item.userId}|"></small></td>
    <td><strong th:text="${item.fullName}"></strong><small th:text="${item.phone ?: 'Chưa có số điện thoại'}"></small></td>
    <td><span class="account-role" th:classappend="| role-${#strings.toLowerCase(item.role.name())}|" th:text="${item.role}"></span></td>
    <td><span class="account-status" th:classappend="| status-${#strings.toLowerCase(item.status.name())}|" th:text="${item.status}"></span></td>
    <td th:text="${item.email ?: '—'}"></td>
    <td th:text="${@view.date(item.createdAt)}"></td>
    <td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/accounts/{id}(id=${item.userId})}">Chi tiết</a></td>
  </tr>
  <tr th:if="${#lists.isEmpty(page.content)}"><td colspan="7"><div class="account-empty"><i class="bi bi-person-x"></i><strong>Không tìm thấy tài khoản phù hợp</strong><span>Thử thay đổi từ khóa hoặc bộ lọc.</span></div></td></tr>
  </tbody>
</table></div>
</div>
<nav class="d-flex justify-content-between align-items-center mt-3" th:if="${page.totalPages > 0}">
  <small class="text-muted" th:text="|Tổng cộng ${page.totalElements} tài khoản|"></small>
  <div class="btn-group"><a class="btn btn-outline-secondary btn-sm" th:classappend="${page.page == 0} ? disabled" th:href="@{/admin/accounts(page=${page.page-1},keyword=${keyword},role=${role},status=${status})}">Trước</a><span class="btn btn-light btn-sm disabled" th:text="|${page.page+1} / ${page.totalPages}|"></span><a class="btn btn-outline-secondary btn-sm" th:classappend="${page.page+1 >= page.totalPages} ? disabled" th:href="@{/admin/accounts(page=${page.page+1},keyword=${keyword},role=${role},status=${status})}">Sau</a></div>
</nav>
</section></body></html>
