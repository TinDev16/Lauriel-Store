<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="promotion-preview-content">
    <!-- Discount and Time Summary -->
    <div class="card mb-3 border shadow-sm">
        <div class="card-body p-3">
            <div class="row g-2 text-center">
                <div class="col-6 border-end">
                    <span class="text-muted small d-block mb-1">Mức giảm</span>
                    <span class="h4 mb-0 fw-bold text-danger" th:text="|-${@view.number(orderPromotion.discountPercent)}%|">-5%</span>
                </div>
                <div class="col-6">
                    <span class="text-muted small d-block mb-1">Đơn tối thiểu</span>
                    <span class="h5 mb-0 fw-bold text-primary" th:text="${@view.money(orderPromotion.minOrderAmount)}">0 ₫</span>
                </div>
            </div>
            <hr class="my-2">
            <div class="small">
                <div class="d-flex justify-content-between mb-1" th:if="${orderPromotion.maxDiscountAmount != null}">
                    <span class="text-muted"><i class="bi bi-shield-check me-1"></i>Mức giảm tối đa:</span>
                    <span class="fw-semibold text-danger" th:text="${@view.money(orderPromotion.maxDiscountAmount)}">100.000 ₫</span>
                </div>
                <div class="d-flex justify-content-between" th:if="${orderPromotion.maxDiscountAmount == null}">
                    <span class="text-muted"><i class="bi bi-shield-check me-1"></i>Mức giảm tối đa:</span>
                    <span class="fw-semibold text-muted">Không giới hạn</span>
                </div>
            </div>

            <div class="d-flex flex-column gap-2 mt-3 pt-2 border-top">
                <div class="d-flex justify-content-between align-items-center p-2 rounded-3 bg-light border">
                    <span class="text-secondary fw-semibold fs-6">
                        <i class="bi bi-calendar-event text-primary me-2 fs-5 align-middle"></i>Thời gian bắt đầu:
                    </span>
                    <span class="fw-bold text-dark fs-6" th:text="${@view.date(orderPromotion.startDate)}">01/01/2026 00:00</span>
                </div>
                <div class="d-flex justify-content-between align-items-center p-2 rounded-3 bg-light border">
                    <span class="text-secondary fw-semibold fs-6">
                        <i class="bi bi-calendar-check text-danger me-2 fs-5 align-middle"></i>Thời gian kết thúc:
                    </span>
                    <span class="fw-bold text-danger fs-6" th:text="${@view.date(orderPromotion.endDate)}">31/12/2026 23:59</span>
                </div>
            </div>
            <div class="mt-2 pt-2 border-top small" th:if="${orderPromotion.description != null and !#strings.isEmpty(orderPromotion.description)}">
                <span class="text-muted d-block mb-1"><i class="bi bi-info-circle me-1"></i>Mô tả:</span>
                <p class="mb-0 text-dark preserve-lines" th:text="${orderPromotion.description}"></p>
            </div>
        </div>
    </div>

    <!-- Action buttons -->
    <div class="d-flex flex-column gap-2 mb-2 promotion-preview-actions">
        <a class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-1"
           th:href="@{/admin/order-promotions/{id}/edit(id=${orderPromotion.orderPromotionId})}">
            <i class="bi bi-pencil"></i>
            <span>Chỉnh sửa ưu đãi</span>
        </a>

        <form method="post" th:action="@{/admin/order-promotions/{id}/status(id=${orderPromotion.orderPromotionId})}"
              data-confirm="Xác nhận thay đổi trạng thái ưu đãi đơn hàng này?">
            <input type="hidden" name="status" th:value="${orderPromotion.status.name() == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
            <button class="btn w-100 d-flex align-items-center justify-content-center gap-1"
                    th:classappend="${orderPromotion.status.name() == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'">
                <i class="bi" th:classappend="${orderPromotion.status.name() == 'ACTIVE'} ? 'bi-stop-circle' : 'bi-play-circle'"></i>
                <span th:text="${orderPromotion.status.name() == 'ACTIVE' ? 'Ngừng kích hoạt' : 'Kích hoạt ưu đãi'}"></span>
            </button>
        </form>

        <button type="button" class="btn btn-outline-secondary btn-promotion-quickview-close btn-quickview-close">
            <i class="bi bi-x-lg me-1"></i>Đóng
        </button>
    </div>
</div>
</body>
</html>
