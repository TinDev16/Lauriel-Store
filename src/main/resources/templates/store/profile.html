<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{store/fragments/layout :: layout(~{::main},'Tài khoản')}"><body><main class="container-xl store-page"><header class="store-page-heading"><div><span>TÀI KHOẢN</span><h1>Hồ sơ của tôi</h1><p>Quản lý thông tin dùng cho đơn hàng và giao nhận.</p></div><a class="store-btn store-btn-dark" th:href="@{/shop/profile/edit}"><i class="bi bi-pencil"></i> Chỉnh sửa</a></header><div class="store-profile-layout"><section class="store-profile-card"><div class="store-avatar"><i class="bi bi-person"></i></div><h2 th:text="${profile.fullName}"></h2><span th:text="|@${profile.username}|"></span><form method="post" th:action="@{/logout}"><button class="store-link-button text-danger">Đăng xuất</button></form></section><section class="store-profile-info"><div><i class="bi bi-envelope"></i><span>Email</span><strong th:text="${profile.email ?: 'Chưa cập nhật'}"></strong></div><div><i class="bi bi-telephone"></i><span>Số điện thoại</span><strong th:text="${profile.phone ?: 'Chưa cập nhật'}"></strong></div><div class="store-profile-address"><i class="bi bi-geo-alt"></i><span>Địa chỉ giao hàng</span><strong th:text="${profile.address ?: 'Chưa cập nhật'}"></strong></div><a th:href="@{/shop/orders}"><i class="bi bi-receipt"></i><span>Đơn hàng của tôi</span><i class="bi bi-chevron-right"></i></a></section></div></main></body></html>
