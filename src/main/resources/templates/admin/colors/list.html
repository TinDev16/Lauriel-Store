<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Màu sắc','colors')}">
<body>
<section>
<div class="mb-3">
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/colors/new}">Thêm màu sắc</a>
</div>
<form class="card card-body mb-3" data-local-filter>
<input class="form-control" type="search" name="keyword" placeholder="Tìm theo tên màu sắc..."></form>
<div class="card">
<div class="table-responsive">
<table class="table mb-0">
<thead>
<tr>
<th>Mã</th>
<th>Tên</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${items}" data-filter-row th:attr="data-search=${r.colorName}">
<td th:text="${r.colorId}">
</td>
<td th:text="${r.colorName}">
</td>
<td>
<a class="btn btn-outline-primary btn-sm" th:href="@{/admin/colors/{id}/edit(id=${r.colorId})}">Sửa</a>
</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</body>
</html>
