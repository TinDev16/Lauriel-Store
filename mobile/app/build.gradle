plugins { id 'com.android.application' }

android {
    namespace 'com.lauriel.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lauriel.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [usesCleartextTraffic: 'false']
        buildConfigField 'String', 'API_BASE_URL', '"' + providers.gradleProperty('apiBaseUrl').orElse('http://10.0.2.2:8080/').get() + '"'
    }
    buildTypes {
        debug { manifestPlaceholders.usesCleartextTraffic = 'true' }
        release {
            minifyEnabled false
            manifestPlaceholders.usesCleartextTraffic = 'false'
            buildConfigField 'String', 'API_BASE_URL', '"https://example.invalid/"'
        }
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.2'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
