<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Kích cỡ','sizes')}">
<body>
<section>
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary btn-sm fw-semibold shadow-sm" th:href="@{/admin/sizes/new}">
            <i class="bi bi-plus-lg me-1"></i>Thêm kích cỡ
        </a>
    </div>
</div>

<form class="card card-body mb-3" data-local-filter>
    <div class="row g-3">
        <div class="col-12">
            <input class="form-control" type="search" name="keyword" placeholder="Tìm theo tên kích cỡ...">
        </div>
    </div>
</form>

<div class="card">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead>
<tr>
<th>Mã</th>
<th>Tên kích cỡ</th>
<th>Thao tác</th>
</tr>
</thead>
<tbody>
<tr th:each="r:${items}" data-filter-row th:attr="data-search=${r.sizeName}">
<td class="fw-semibold text-muted" th:text="|#${r.sizeId}|"></td>
<td class="fw-bold" th:text="${r.sizeName}"></td>
<td class="text-nowrap">
    <div class="table-actions">
        <a class="btn btn-soft-primary" th:href="@{/admin/sizes/{id}/edit(id=${r.sizeId})}" title="Sửa kích cỡ">
            <i class="bi bi-pencil"></i>Sửa
        </a>
    </div>
</td>
</tr>
<tr th:if="${#lists.isEmpty(items)}">
    <td colspan="3" class="text-muted text-center p-4">
        <i class="bi bi-inbox fs-3 d-block mb-1"></i>
        <span>Chưa có kích cỡ nào.</span>
    </td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
</body>
</html>
