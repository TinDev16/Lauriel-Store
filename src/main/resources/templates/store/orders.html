<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{store/fragments/layout :: layout(~{::main},'Đơn hàng')}"><body><main class="container-xl store-page">
<header class="store-page-heading"><div><span>TÀI KHOẢN</span><h1>Đơn hàng của tôi</h1><p>Theo dõi trạng thái và xem lại các đơn đã đặt.</p></div></header><nav class="store-status-chips"><a th:classappend="${selectedStatus == null} ? active" th:href="@{/shop/orders}">Tất cả</a><a th:each="s:${T(com.lauriel.store.entity.enums.OrderStatus).values()}" th:if="${s.name() != 'RETURNED'}" th:classappend="${selectedStatus == s} ? active" th:href="@{/shop/orders(status=${s})}" th:text="${@view.label(s)}"></a></nav>
<div class="store-empty" th:if="${#lists.isEmpty(page.content)}"><i class="bi bi-receipt"></i><h2>Bạn chưa có đơn hàng.</h2><a class="store-btn store-btn-dark" th:href="@{/shop/products}">Mua sắm ngay</a></div><section class="store-order-list"><article class="store-order-card" th:each="o:${page.content}"><header><div><small>MÃ ĐƠN</small><strong th:text="|#${o.orderId}|"></strong></div><span class="store-order-status" th:classappend="| status-${#strings.toLowerCase(o.status.name())}|" th:text="${@view.label(o.status)}"></span></header><div class="store-order-meta"><span><i class="bi bi-calendar3"></i><span th:text="${@view.date(o.createdAt)}"></span></span><span><i class="bi bi-truck"></i>Phí giao <strong th:text="${@view.money(o.shippingFee)}"></strong></span></div><footer><div><small>Tổng thanh toán</small><strong th:text="${@view.money(o.finalAmount)}"></strong></div><a class="store-btn store-btn-outline" th:href="@{/shop/orders/{id}(id=${o.orderId})}">Xem chi tiết</a></footer></article></section>
<nav class="store-pagination" th:if="${page.totalPages > 1}"><a th:classappend="${page.page == 0} ? disabled" th:href="@{/shop/orders(page=${page.page - 1},status=${selectedStatus})}"><i class="bi bi-arrow-left"></i></a><span th:text="|Trang ${page.page + 1} / ${page.totalPages}|"></span><a th:classappend="${page.page + 1 >= page.totalPages} ? disabled" th:href="@{/shop/orders(page=${page.page + 1},status=${selectedStatus})}"><i class="bi bi-arrow-right"></i></a></nav>
</main></body></html>
