<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Phiếu nhập kho','purchase-receipts')}">
<body><section>
<div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
<div><h2 class="h4 mb-1">Danh sách phiếu nhập</h2><p class="text-muted mb-0">Theo dõi nhà cung cấp, người tạo và toàn bộ hàng hóa trong từng phiếu.</p></div>
<a class="btn btn-primary" th:href="@{/admin/purchase-receipts/new}">Tạo phiếu nhập</a></div>
<form class="card card-body mb-4" method="get" th:action="@{/admin/purchase-receipts}" data-live-filter>
<div class="row g-3 align-items-end">
<div class="col-lg-4"><label class="form-label" for="receipt-keyword">Tìm phiếu nhập</label>
<input id="receipt-keyword" class="form-control" type="search" name="keyword"
       placeholder="Mã phiếu, nhà cung cấp, người tạo..." th:value="${keyword}"></div>
<div class="col-md-4 col-lg-2"><label class="form-label" for="receipt-status">Trạng thái</label>
<select id="receipt-status" class="form-select" name="status"><option value="">Tất cả trạng thái</option>
<option th:each="item:${receiptStatuses}" th:value="${item}" th:text="${@view.label(item)}"
        th:selected="${item == status}"></option></select></div>
<div class="col-md-4 col-lg-2"><label class="form-label" for="receipt-from">Từ thời gian</label>
<input id="receipt-from" class="form-control" type="datetime-local" name="from" th:value="${from}"></div>
<div class="col-md-4 col-lg-2"><label class="form-label" for="receipt-to">Đến thời gian</label>
<input id="receipt-to" class="form-control" type="datetime-local" name="to" th:value="${to}"></div>
<div class="col-lg-2 d-flex gap-2"><button class="btn btn-primary flex-grow-1">Lọc</button>
<a class="btn btn-outline-secondary" th:href="@{/admin/purchase-receipts}" title="Xóa bộ lọc">Đặt lại</a></div>
</div></form>
<div class="card"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
<thead><tr><th>Phiếu nhập</th><th>Nhà cung cấp / Người tạo</th><th style="min-width: 420px">Nội dung phiếu</th><th>Trạng thái</th><th class="text-end">Tổng tiền</th><th class="text-end">Thao tác</th></tr></thead>
<tbody><tr th:each="r:${page.content}">
<td class="text-nowrap"><div class="fw-semibold" th:text="|PN-${r.receiptId}|"></div><div class="small text-muted" th:text="${@view.date(r.createdAt)}"></div></td>
<td><div class="fw-semibold" th:text="${r.supplier.supplierName}"></div>
<div class="small text-muted" th:if="${r.createdBy != null}" th:text="|Người tạo: ${r.createdBy.fullName != null and !#strings.isEmpty(r.createdBy.fullName) ? r.createdBy.fullName : r.createdBy.username}|"></div>
<div class="small text-muted" th:if="${r.createdBy == null}">Không có thông tin người tạo</div></td>
<td><div th:if="${#lists.isEmpty(r.items)}" class="text-muted">Chưa có mặt hàng</div>
<div th:each="item,stat:${r.items}" class="py-2" th:classappend="${!stat.last} ? ' border-bottom'"><div class="d-flex justify-content-between gap-3">
<div><div class="fw-semibold" th:text="${item.productName}"></div><div class="d-flex flex-wrap gap-1 mt-1">
<span class="badge text-bg-light border" th:text="|Kích cỡ: ${item.size.sizeName}|"></span><span class="badge text-bg-light border" th:text="|Màu: ${item.color.colorName}|"></span>
<span class="small text-muted align-self-center" th:text="|SKU: ${item.sku}|"></span></div></div>
<div class="text-end text-nowrap"><div th:text="|${item.quantity} × ${@view.money(item.unitPrice)}|"></div><strong th:text="${@view.money(item.lineTotal)}"></strong></div>
</div></div></td>
<td><span class="badge" th:classappend="${r.status.name() == 'COMPLETED'} ? ' text-bg-success' : (${r.status.name() == 'CANCELLED'} ? ' text-bg-secondary' : ' text-bg-warning')" th:text="${@view.label(r.status)}"></span></td>
<td class="text-end fw-semibold text-nowrap" th:text="${@view.money(r.totalAmount)}"></td>
<td class="text-end"><a class="btn btn-outline-primary btn-sm" th:href="@{/admin/purchase-receipts/{id}(id=${r.receiptId})}">Chi tiết</a></td>
</tr><tr th:if="${#lists.isEmpty(page.content)}"><td colspan="6" class="text-muted text-center p-4">Chưa có dữ liệu phù hợp.</td></tr>
</tbody></table></div></div><div th:replace="~{fragments/pagination :: pagination}"></div>
</section></body></html>
