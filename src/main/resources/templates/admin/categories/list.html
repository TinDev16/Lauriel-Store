<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::section},'Phân loại','categories')}">
<body><section>
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary btn-sm fw-semibold shadow-sm" th:href="@{/admin/categories/new}">
            <i class="bi bi-plus-lg me-1"></i>Thêm phân loại
        </a>
    </div>
</div>

<!-- Tabs chuyển đổi trạng thái -->
<ul class="nav admin-nav-tabs mb-3" role="tablist">
    <li class="nav-item">
        <a class="nav-link d-flex align-items-center gap-2"
           th:classappend="${effectiveStatus.name() == 'ACTIVE'} ? 'active' : ''"
           th:href="@{/admin/categories}">
            <i class="bi bi-check-circle-fill text-success"></i>
            <span>Đang hoạt động</span>
            <span class="badge rounded-pill"
                  th:classappend="${effectiveStatus.name() == 'ACTIVE'} ? 'bg-primary text-white' : 'bg-secondary-subtle text-secondary'"
                  th:text="${activeCount}">0</span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link d-flex align-items-center gap-2 tab-inactive"
           th:classappend="${effectiveStatus.name() == 'INACTIVE'} ? 'active' : ''"
           th:href="@{/admin/categories(status='INACTIVE')}">
            <i class="bi bi-slash-circle-fill text-danger"></i>
            <span>Ngừng hoạt động</span>
            <span class="badge rounded-pill"
                  th:classappend="${effectiveStatus.name() == 'INACTIVE'} ? 'bg-danger text-white' : 'bg-danger-subtle text-danger'"
                  th:text="${inactiveCount}">0</span>
        </a>
    </li>
</ul>

<!-- Banner thông báo khi xem danh sách ngừng hoạt động -->
<div th:if="${effectiveStatus.name() == 'INACTIVE'}" class="alert alert-warning border-warning d-flex align-items-center py-2 px-3 mb-3">
    <i class="bi bi-exclamation-triangle-fill text-warning fs-5 me-2"></i>
    <div>
        <strong>Danh sách phân loại ngừng hoạt động:</strong>
        <span class="text-muted ms-1">Các phân loại này không hiển thị trên cửa hàng và danh mục tạo sản phẩm mới. Bạn có thể kích hoạt lại bất kỳ lúc nào.</span>
    </div>
</div>

<form class="card card-body mb-3" data-local-filter>
    <div class="row g-3">
        <div class="col-12">
            <input class="form-control" type="search" name="keyword" placeholder="Tìm theo tên phân loại...">
        </div>
    </div>
</form>

<div class="card"><div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead><tr><th>ID</th><th>Tên phân loại</th><th>Số sản phẩm</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
<tbody>
<tr th:each="r:${items}" data-filter-row th:attr="data-search=${r.categoryName},data-status=${r.status}">
<td th:text="${r.categoryId}"></td>
<td class="fw-semibold" th:text="${r.categoryName}"></td>
<td><span class="badge bg-light text-dark border" th:text="|${r.productCount} sản phẩm|">0 sản phẩm</span></td>
<td>
    <span class="badge-status"
          th:classappend="${r.status.name() == 'ACTIVE'} ? 'badge-status-active' : 'badge-status-inactive'">
        <i class="bi" th:classappend="${r.status.name() == 'ACTIVE'} ? 'bi-check-circle-fill' : 'bi-pause-circle-fill'"></i>
        <span th:text="${@view.label(r.status)}"></span>
    </span>
</td>
<td class="text-nowrap">
    <div class="table-actions">
        <a class="btn btn-soft-primary" th:href="@{/admin/categories/{id}/edit(id=${r.categoryId})}" title="Sửa phân loại">
            <i class="bi bi-pencil"></i>Sửa
        </a>
        <form class="d-inline" method="post" th:action="@{/admin/categories/{id}/status(id=${r.categoryId})}"
              th:attr="data-confirm=${r.status.name() == 'ACTIVE'} ? 'Ngừng hoạt động phân loại này? Phân loại sẽ bị ẩn khỏi cửa hàng.' : 'Kích hoạt lại phân loại này?'">
            <input type="hidden" name="status" th:value="${r.status.name() == 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'}">
            <input type="hidden" name="returnUrl" th:value="${effectiveStatus.name() == 'INACTIVE' ? '/admin/categories?status=INACTIVE' : '/admin/categories'}">
            <button class="btn"
                    th:classappend="${r.status.name() == 'ACTIVE'} ? 'btn-soft-danger' : 'btn-soft-success'"
                    th:title="${r.status.name() == 'ACTIVE' ? 'Ngừng hoạt động' : 'Kích hoạt lại'}">
                <i class="bi" th:classappend="${r.status.name() == 'ACTIVE'} ? 'bi-pause-circle' : 'bi-play-circle'"></i>
                <span th:text="${r.status.name() == 'ACTIVE' ? 'Ngừng' : 'Kích hoạt'}"></span>
            </button>
        </form>
    </div>
</td></tr>
<tr th:if="${#lists.isEmpty(items)}">
    <td colspan="5" class="text-muted text-center p-4">
        <i class="bi bi-inbox fs-3 d-block mb-1"></i>
        <span th:text="${effectiveStatus.name() == 'INACTIVE' ? 'Hiện không có phân loại nào ngừng hoạt động.' : 'Chưa có phân loại nào đang hoạt động.'}">Chưa có phân loại.</span>
    </td>
</tr>
</tbody></table>
</div></div>
</section></body>
</html>
